name: CI

# Public repo — Actions minutes are free, so this runs on every push and PR.
# Runs the individual scripts rather than a single `ci` target so a failure
# names the thing that broke.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # The agent is not reachable from CI, and it must not need to be: every
        # call to it happens in a route handler at request time, never at build
        # time. If this step ever starts failing on a network error, something
        # moved a fetch into the build and that is the bug.
        env:
          MAJSQ_AGENT_URL: http://localhost:8000
          MAJSQ_SERVICE_SECRET: ci-only
        run: npm run build

      - name: No hard-coded colors
        # DESIGN.md's one mechanical rule: components use tokens, never hex.
        # Two people share this repo; without a check, the first hurried hex
        # value is invisible until the themes disagree.
        #
        # A line may opt out with an `allow-hex:` comment ABOVE it, and the
        # comment has to say why — the two real cases so far are browser-chrome
        # metadata the browser reads before any stylesheet exists. An opt-out
        # you have to justify in writing is one people use sparingly.
        run: |
          hits=$(grep -rnE '#[0-9a-fA-F]{3,8}\b' src --include='*.tsx' || true)
          bad=""
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            file=${hit%%:*}
            rest=${hit#*:}
            line=${rest%%:*}
            # Look at the six lines above for the marker, so a block comment
            # covers the whole declaration it introduces.
            start=$(( line > 6 ? line - 6 : 1 ))
            if sed -n "${start},${line}p" "$file" | grep -q 'allow-hex:'; then
              continue
            fi
            bad="$bad$hit"$'\n'
          done <<< "$hits"

          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Hard-coded color. Use a token from globals.css (see DESIGN.md), or add an 'allow-hex: <why>' comment above it."
            exit 1
          fi
          echo "  no unjustified hex values"
